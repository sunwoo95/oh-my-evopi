[project]
name = "evopi-skill-notion"
version = "0.1.0"
description = "Notion integration skill for evopi (Notion's official hosted MCP server)."
requires-python = ">=3.10"
dependencies = ["mcp", "httpx", "evopi-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notion"]
